[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-google-rag"
version = "1.0.0"
description = "A transparent local RAG pipeline over Software Engineering at Google PDFs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jan Valentin Haag" },
]
keywords = ["rag", "retrieval-augmented-generation", "embeddings", "gemini", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-genai>=1.0,<2.0",
    "numpy>=2.0,<3.0",
    "pypdf>=5.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
swe-google-rag = "swe_google_rag.main:main"

[project.urls]
Repository = "https://github.com/haagjjan/google-swe-rag"
Issues = "https://github.com/haagjjan/google-swe-rag/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
